[package]
name = "lattice"
version = "0.4.0"
edition = "2024"
description = "Keyboard-driven window snapping for macOS"
license = "MIT"

[dependencies]
global-hotkey = "0.7"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-service-management = "0.3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
toml = "0.8"
tray-icon = "0.21"
winit = "0.30"
